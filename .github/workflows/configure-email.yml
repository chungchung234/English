name: Prepare login email templates
on:
  push:
    branches: [main]
    paths:
      - scripts/configure-login-email.mjs
      - .github/workflows/configure-email.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node scripts/configure-login-email.mjs
        env:
          SUPABASE_PROJECT_REF: domkmxmwmihcfadophfg
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
