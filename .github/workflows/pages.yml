name: Publish 시시콜콜 website
on:
  push:
    branches: [main]
    paths:
      - web/**
      - src/**
      - supabase/**
      - package.json
      - package-lock.json
      - test/**
      - scripts/evaluate-memory.mjs
      - scripts/build-web.mjs
      - scripts/deploy.py
      - scripts/prepare-hosting.mjs
      - scripts/live-smoke.mjs
      - scripts/synthetic-audio.py
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DEPLOY_BACKEND: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate types and server/database behavior
        run: |
          npm run check
          npm test
          npm run eval:memory
      - name: Validate character rendering, memory controls and mobile browser
        run: |
          npm run test:presence
          npm run test:browser
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - name: Resolve public site connection
        run: node scripts/prepare-hosting.mjs
        env:
          SUPABASE_PROJECT_REF: domkmxmwmihcfadophfg
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_KEY: ${{ vars.PUBLIC_SUPABASE_KEY || secrets.PUBLIC_SUPABASE_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy managed database and voice function
        if: env.DEPLOY_BACKEND == 'true'
        run: python3 scripts/deploy.py --apply
        env:
          SUPABASE_PROJECT_REF: domkmxmwmihcfadophfg
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - run: npm run build -- --require-config
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    permissions:
      contents: write
      pages: write
      id-token: write
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare browser and synthetic speech
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y espeak-ng
          espeak-ng -s 145 -w /tmp/loop-utterance.wav "Hi there. Yesterday I went to a cafe with my friend. Today I am thinking of visiting a park."
          python3 scripts/synthetic-audio.py /tmp/loop-utterance.wav /tmp/loop-smoke.wav
      - name: Verify live voice, memory and account isolation
        run: node scripts/live-smoke.mjs
        env:
          SUPABASE_PROJECT_REF: domkmxmwmihcfadophfg
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          SMOKE_AUDIO: /tmp/loop-smoke.wav
      - name: Save synthetic release screenshots
        if: always()
        run: |
          python3 - <<'PYSCREEN'
          from pathlib import Path
          import shutil
          out=Path('docs/release-evidence')
          for image in Path('test-results').glob('live-*.png'):
              out.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(image,out/image.name)
          PYSCREEN
          if [ ! -d docs/release-evidence ]; then exit 0; fi
          git checkout -b release-evidence-${{ github.run_id }}
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add docs/release-evidence
          git commit -m "Capture isolated synthetic release verification"
          git push origin HEAD:refs/heads/release-evidence-${{ github.run_id }}
