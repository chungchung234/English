name: Check provider readiness
on:
  push:
    branches: [main]
    paths:
      - scripts/provider-status.mjs
      - .github/workflows/provider-status.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Diagnose management credential without revealing it
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 - <<'PYAUTH'
          import os, json, urllib.request, urllib.error
          token=os.environ.get('SUPABASE_ACCESS_TOKEN','')
          kind=('management token' if token.startswith('sbp_') else 'publishable project key' if token.startswith('sb_publishable_') else 'secret project key' if token.startswith('sb_secret_') else 'JWT-shaped token' if token.count('.')==2 else 'unknown format')
          print('Credential kind:',kind)
          print('Leading/trailing whitespace:',token!=token.strip())
          for path in ['/v1/projects/zsapmrcurmzgsaccscwe','/v1/projects/zsapmrcurmzgsaccscwe/api-keys?reveal=false']:
            req=urllib.request.Request('https://api.supabase.com'+path,headers={'Authorization':'Bearer '+token})
            try:
              with urllib.request.urlopen(req,timeout=20) as response: print(path.split('?')[0],response.status)
            except urllib.error.HTTPError as error: print(path.split('?')[0],error.code)
          PYAUTH
      - run: node scripts/provider-status.mjs
        env:
          SUPABASE_PROJECT_REF: zsapmrcurmzgsaccscwe
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
