<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>통화 이후 현재 화면 감사</title><style>body{margin:0;padding:32px;background:#f2f4f7;color:#162034;font:16px/1.6 -apple-system,BlinkMacSystemFont,sans-serif}header{max-width:1200px;margin:auto auto 28px}h1{font-size:27px;margin:0 0 10px}header p{max-width:900px;margin:8px 0}.grid{max-width:1200px;margin:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}figure{margin:0;padding:18px;background:white;border:1px solid #dce1e9;border-radius:12px;align-self:start}h2{font-size:18px;margin:0 0 14px}img{display:block;width:100%;height:auto;border:1px solid #e4e7ed}figcaption{margin-top:14px;min-height:82px;font-size:15px}a{color:#2636bd}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){body{padding:16px}.grid{grid-template-columns:1fr}}</style><header><h1>통화 종료 → 복습: 현재 화면 감사</h1><p><strong>최종 시안이 아니라 현재 게시된 화면의 캡처입니다.</strong> 결과가 원문 아래로 밀리는 순서, 상태 문구의 모순, 연습 진입과 완료 경계를 우선 개선할 필요가 있습니다.</p><p>2026-11-11 · 게시 HTML·모듈·CSP·자산 그대로, 실제 Chromium. 인증·음성·기록 응답은 격리된 합성 데이터와 로컬 SQL입니다. 실제 사용자 기록·모델 응답 품질·iPhone 하드웨어·스크린리더 청취는 검증하지 않았습니다.</p><p><a href="README.md">전체 진단·개선 기획</a> · 이미지를 누르면 원래 크기로 열립니다.</p></header><main class="grid"><figure><h2>1 · 종료 직후</h2><a href="primary/01-immediate-after-hangup.png"><img src="primary/01-immediate-after-hangup.png" alt="1 · 종료 직후 실제 캡처" loading="eager"></a><figcaption>미흡 · 첫 화면이 종료 결과보다 저장 안내와 열린 대화문에 집중된다.</figcaption></figure><figure><h2>2 · 저장 후 준비 중</h2><a href="primary/02-saved-analysis-pending.png"><img src="primary/02-saved-analysis-pending.png" alt="2 · 저장 후 준비 중 실제 캡처" loading="eager"></a><figcaption>미흡 · 첫 화면의 원문은 그대로이고 준비 상태·후속 행동은 아래에 있다.</figcaption></figure><figure><h2>3 · 결과 준비 완료</h2><a href="primary/03-analysis-ready-same-position.png"><img src="primary/03-analysis-ready-same-position.png" alt="3 · 결과 준비 완료 실제 캡처" loading="eager"></a><figcaption>우선 개선 · 결과가 생겨도 원문 아래에 남는다. 12개 발화 예시의 피드백 제목 y1,513px.</figcaption></figure><figure><h2>3a · 같은 회차 재진입</h2><a href="primary/06-same-call-history-reentry.png"><img src="primary/06-same-call-history-reentry.png" alt="3a · 같은 회차 재진입 실제 캡처" loading="eager"></a><figcaption>미흡 · 기록에서 다시 열면 원문이 뒤로 가고 접힌다. 같은 내용의 읽는 순서가 달라진다.</figcaption></figure><figure><h2>3b · 작은 화면</h2><a href="secondary/02-ready-feedback-320.png"><img src="secondary/02-ready-feedback-320.png" alt="3b · 작은 화면 실제 캡처" loading="eager"></a><figcaption>미흡 · 명시적 재진입에서도 320px 첫 화면은 요약 부근에서 끝난다.</figcaption></figure><figure><h2>4 · 연습 펼침</h2><a href="secondary/03-practice-options-390.png"><img src="secondary/03-practice-options-390.png" alt="4 · 연습 펼침 실제 캡처" loading="eager"></a><figcaption>미흡 · 같은 문장을 다시 보여 주고 같은 이름의 연습 버튼이 한 번 더 나온다.</figcaption></figure><figure><h2>4a · 실제 회상</h2><a href="secondary/04-active-recall-390.png"><img src="secondary/04-active-recall-390.png" alt="4a · 실제 회상 실제 캡처" loading="eager"></a><figcaption>일부 양호 · 단서와 답안은 구분되지만 미확인 피드백 제목·여러 행동이 경쟁한다.</figcaption></figure><figure><h2>5 · 저장 직후</h2><a href="secondary/06-practice-saved-390.png"><img src="secondary/06-practice-saved-390.png" alt="5 · 저장 직후 실제 캡처" loading="eager"></a><figcaption>미흡 · 화면이 상단으로 돌아가 저장 확인은 보이지 않는다.</figcaption></figure><figure><h2>5a · 저장 후 아래</h2><a href="secondary/06b-practice-saved-details-390.png"><img src="secondary/06b-practice-saved-details-390.png" alt="5a · 저장 후 아래 실제 캡처" loading="eager"></a><figcaption>미흡 · 성공 문장이 작게 남고 이전 지시·미루기·닫기·중복 홈 이동이 함께 보인다.</figcaption></figure><figure><h2>6 · 일반 복습 재방문</h2><a href="secondary/07-returning-review-390.png"><img src="secondary/07-returning-review-390.png" alt="6 · 일반 복습 재방문 실제 캡처" loading="eager"></a><figcaption>미흡 · 완료한 회차와 새로 이어갈 복습의 목적이 섞인다.</figcaption></figure><figure><h2>예외 · 분석 실패</h2><a href="exceptions/end-transcript-feedback-failed-viewport.png"><img src="exceptions/end-transcript-feedback-failed-viewport.png" alt="예외 · 분석 실패 실제 캡처" loading="eager"></a><figcaption>미흡 · 준비 중 문구와 실패 알림이 겹치며 복구 행동은 아래로 밀린다.</figcaption></figure><figure><h2>예외 · 무발화</h2><a href="exceptions/no-user-speech.png"><img src="exceptions/no-user-speech.png" alt="예외 · 무발화 실제 캡처" loading="eager"></a><figcaption>우선 개선 · 만들고 있다는 안내와 발화가 없어 만들지 않는다는 안내가 동시에 보인다.</figcaption></figure><figure><h2>예외 · 일부 전사 누락</h2><a href="exceptions/end-transcript-partial-viewport.png"><img src="exceptions/end-transcript-partial-viewport.png" alt="예외 · 일부 전사 누락 실제 캡처" loading="eager"></a><figcaption>일부 양호 · 수신된 원문은 보존하나 경고와 하단 알림이 겹친다.</figcaption></figure><figure><h2>예외 · 기기 저장 실패</h2><a href="exceptions/end-transcript-device-failed-viewport.png"><img src="exceptions/end-transcript-device-failed-viewport.png" alt="예외 · 기기 저장 실패 실제 캡처" loading="eager"></a><figcaption>일부 양호 · 완료를 거짓 표시하지 않지만 보존 범위와 복구 행동을 읽기 어렵다.</figcaption></figure></main></html>
